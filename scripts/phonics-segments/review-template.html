<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フォニックス区間レビュー</title>
<style>
  :root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#16304c;background:#edf4fc}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:20px}h1{margin:0}.note{color:#49657e}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.panel{background:#fff;border:1px solid #c8dced;border-radius:16px;padding:16px;box-shadow:0 2px 10px #193a5914}video{width:100%;background:#000;border-radius:12px}canvas{width:100%;height:160px;background:#071a2e;border-radius:10px}button{font:inherit;font-weight:700;color:#143a60;background:#fff;border:1px solid #9fc2df;border-radius:9px;padding:8px 10px;cursor:pointer}button:hover{background:#e6f3ff}.primary{background:#1476c9;color:#fff;border-color:#1476c9}.fix{background:#12894f;color:#fff;border-color:#12894f}.danger{background:#fff2f2;border-color:#e5a6a6}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.segment{width:100%;text-align:left;margin:5px 0}.segment.selected{outline:3px solid #f2ac2e}.fixed{color:#08733f}.metric{font:700 13px/1.5 ui-monospace,monospace}.small{font-size:13px}.alternatives button{font-size:12px;padding:5px}.hidden{display:none}input{font:inherit;border:1px solid #9fc2df;border-radius:8px;padding:8px;flex:1;min-width:180px}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.controls{grid-template-columns:repeat(2,1fr)}}
</style>
<main class="wrap">
  <h1>フォニックス区間レビュー</h1>
  <p class="note">A/Bだけの半自動PoC。候補を聴き、±0.01〜0.10秒で調整してからFIXします。FIX済みだけがアプリ用JSONに出力されます。</p>
  <section class="layout">
    <div class="panel">
      <video id="video" controls playsinline preload="metadata"></video>
      <p id="status" aria-live="polite">解析データを読み込み中…</p>
      <canvas id="waveform" width="1600" height="320" aria-label="波形と区間"></canvas>
      <div class="row"><button class="primary" id="play-normal">通常音量でこの区間</button><button class="primary" id="play-flow">通常→40%→次区間</button><button id="stop">停止</button></div>
      <p class="small">「通常→40%→次区間」は、通常音量で選択区間→同じ開始点へ戻して40%→区間末尾からseekせず通常音量で次区間へ連続再生します。</p>
    </div>
    <aside class="panel">
      <h2 id="title">—</h2><p class="metric" id="metrics">—</p>
      <label>ラベル <input id="label"></label>
      <h3>開始</h3><div class="controls" data-side="start"></div>
      <div class="alternatives" id="start-alts"></div>
      <h3>終了</h3><div class="controls" data-side="end"></div>
      <div class="alternatives" id="end-alts"></div>
      <div class="row"><button class="fix" id="fix">FIX</button><button id="unfix">FIX解除</button><button id="save-review">レビュー状態を保存</button><button id="export">アプリ用JSONを書き出す</button></div>
      <hr><h3>区間</h3><div id="segments"></div>
    </aside>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id), video = $("video"), canvas = $("waveform"), ctx = canvas.getContext("2d");
  let data, selected, stopAt = null, flow = null;
  const key = "phonics-segment-review:" + location.pathname;
  const all = () => data.letters.flatMap(letter => letter.segments);
  const fmt = value => Number(value).toFixed(2);
  const persist = () => localStorage.setItem(key, JSON.stringify(data.letters));
  const draw = () => {
    const {times, peaks} = data.waveform, duration = data.duration, w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h); ctx.fillStyle="#071a2e"; ctx.fillRect(0,0,w,h); ctx.strokeStyle="#74c9ff"; ctx.beginPath();
    for(let i=0;i<times.length;i++){const x=times[i]/duration*w, y=peaks[i]*h*.45;ctx.moveTo(x,h/2-y);ctx.lineTo(x,h/2+y)}ctx.stroke();
    all().forEach(segment=>{const x=segment.start/duration*w, width=(segment.end-segment.start)/duration*w;ctx.fillStyle=segment===selected?"#ffb52c77":"#35a5e144";ctx.fillRect(x,0,width,h);ctx.fillStyle="#fff";ctx.font="20px sans-serif";ctx.fillText(segment.id,x+5,25)});
    const x=video.currentTime/duration*w;ctx.strokeStyle="#ff5e52";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
  };
  const renderList = () => { $("segments").replaceChildren(...all().map(segment=>{const button=document.createElement("button");button.className="segment"+(segment===selected?" selected":"");button.innerHTML=`<b>${segment.id}</b> ${segment.label}<br><span class="${segment.fixed?"fixed":""}">${fmt(segment.start)}–${fmt(segment.end)} / ${segment.fixed?"FIX済み":"未FIX"}</span>`;button.onclick=()=>select(segment);return button;})); };
  const buttons = side => {const box=document.querySelector(`[data-side="${side}"]`);box.replaceChildren(...[-.10,-.05,-.01,.01,.05,.10].map(delta=>{const b=document.createElement("button");b.textContent=`${side==="start"?"開始":"終了"} ${delta>0?"+":""}${delta.toFixed(2)}`;b.onclick=()=>{selected[side]=Number((selected[side]+delta).toFixed(2));selected.manuallyAdjusted=true;render()};return b;}));};
  const alternatives = side => {const box=$(side+"-alts");box.innerHTML="候補: "; selected[side+"Alternatives"].forEach(value=>{const b=document.createElement("button");b.textContent=fmt(value);b.onclick=()=>{selected[side]=value;selected.manuallyAdjusted=true;render()};box.append(b)});};
  const render = () => {$("title").textContent=`${selected.id} / ${selected.letter}`;$("label").value=selected.label;$("metrics").textContent=`${fmt(selected.start)}–${fmt(selected.end)}秒  confidence ${selected.confidence}  ${selected.fixed?"FIX済み":"自動候補"}`;buttons("start");buttons("end");alternatives("start");alternatives("end");renderList();draw();persist();};
  const select = segment => {selected=segment;render()};
  const playRange = (start,end,volume,next) => {flow=next;stopAt=end;video.volume=volume;video.currentTime=start;video.play();$("status").textContent=`${fmt(start)}–${fmt(end)}秒を${Math.round(volume*100)}%で再生中`};
  const continueWithoutSeek = nextSegment => {if(!nextSegment){$("status").textContent="最後の区間です。";return}stopAt=nextSegment.end;video.volume=1;video.play();$("status").textContent=`${fmt(nextSegment.start)}–${fmt(nextSegment.end)}秒へ連続再生中（seekなし）`};
  video.addEventListener("timeupdate",()=>{draw();if(stopAt!==null&&video.currentTime>=stopAt){video.pause();const next=flow;stopAt=null;flow=null;if(next)next();else $("status").textContent="区間の再生が終わりました。"}});
  $("play-normal").onclick=()=>playRange(selected.start,selected.end,1,null);
  $("play-flow").onclick=()=>{const index=all().indexOf(selected), nextSegment=all()[index+1];playRange(selected.start,selected.end,1,()=>playRange(selected.start,selected.end,.4,()=>continueWithoutSeek(nextSegment)))};
  $("stop").onclick=()=>{video.pause();stopAt=null;flow=null;$("status").textContent="停止しました。"};
  $("label").oninput=e=>{selected.label=e.target.value;renderList();persist()};
  $("fix").onclick=()=>{selected.fixed=true;selected.manuallyAdjusted=true;render()};$("unfix").onclick=()=>{selected.fixed=false;render()};
  const download = (payload,name) => {const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));a.download=name;a.click();URL.revokeObjectURL(a.href)};
  $("save-review").onclick=()=>{download(data,data.lessonId+"-fixed-segments.json");$("status").textContent="レビュー状態を保存しました。"};
  $("export").onclick=()=>{const unfixed=all().filter(s=>!s.fixed);if(unfixed.length){$("status").textContent=`未FIX: ${unfixed.map(s=>s.id).join(", ")}`;return}const output={lessonId:data.lessonId,sourceId:data.sourceId,repeatVolume:data.repeatVolume,letters:data.letters.map(letter=>({letter:letter.letter,segments:letter.segments.map(({id,start,end})=>({id,start,end}))}))};download(output,data.lessonId+".json");$("status").textContent="アプリ用JSONを保存しました。"};
  fetch("analysis.json").then(r=>r.json()).then(result=>{data=result;const saved=localStorage.getItem(key);if(saved)data.letters=JSON.parse(saved);video.src="../../../"+data.sourceVideo.replaceAll("\\","/");selected=all()[0];render();$("status").textContent="A/Bの自動候補を読み込みました。"}).catch(error=>$("status").textContent="読み込み失敗: "+error.message);
})();
</script>
</html>
