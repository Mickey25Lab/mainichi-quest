<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>マスターメダル WebP キャンバスサイズ比較</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background:#e9edf4; color:#142033; }
    * { box-sizing:border-box; }
    body { margin:0; }
    header { position:sticky; top:0; z-index:2; padding:18px clamp(18px,4vw,48px); background:#112037ee; color:#fff; backdrop-filter:blur(12px); }
    h1 { margin:0 0 6px; font-size:clamp(21px,3vw,34px); }
    header p { margin:4px 0; color:#cbd7eb; }
    main { max-width:1700px; margin:auto; padding:30px clamp(14px,3vw,40px) 60px; }
    section { margin-bottom:54px; }
    h2 { margin:0 0 18px; font-size:28px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
    article { background:#fff; border:1px solid #cbd4e2; border-radius:16px; box-shadow:0 7px 22px #26364e18; overflow:hidden; }
    .meta { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid #dde3ed; }
    .meta strong { font-size:20px; }
    .meta span { color:#53647a; font-variant-numeric:tabular-nums; }
    .samples { display:grid; grid-template-columns:1fr 1fr; min-height:300px; }
    .sample { display:grid; grid-template-rows:1fr auto; align-items:center; justify-items:center; padding:12px 8px 9px; overflow:hidden; }
    .sample.light { background:linear-gradient(135deg,#fff,#dce6f4); color:#34445c; }
    .sample.dark { background:linear-gradient(135deg,#202838,#080b11); color:#d8e3f4; }
    .sample img { width:100%; max-width:260px; aspect-ratio:1; object-fit:contain; image-rendering:auto; }
    .sample small { font-weight:700; letter-spacing:.08em; }
    .original { outline:3px solid #56a6ff; outline-offset:-3px; }
    footer { padding:16px; color:#53647a; text-align:center; }
    @media(max-width:430px){ .grid{grid-template-columns:1fr}.samples{min-height:260px} }
  </style>
</head>
<body>
  <header>
    <h1>06_medal｜WebPキャンバスサイズ比較</h1>
    <p>RGB Quality 100 / Alpha Quality 100 / method 6 / LANCZOS</p>
    <p>同じ表示面積で細部と透明境界を比較。画像をクリックすると原寸表示します。</p>
  </header>
  <main id="app"></main>
  <footer>QA comparison only — production assets are unchanged.</footer>
  <script>
    const vehicles = [
      { id: '02_fire_engine', label: '02 Fire Engine（消防車）' },
      { id: '11_road_roller', label: '11 Road Roller（ロードローラー）' }
    ];
    const sizes = [1254, 1024, 768, 640, 512, 448, 384];
    const app = document.querySelector('#app');
    const kb = bytes => `${(bytes / 1024).toFixed(1)} KB`;

    fetch('./manifest.json').then(r => r.json()).then(manifest => {
      for (const vehicle of vehicles) {
        const section = document.createElement('section');
        section.innerHTML = `<h2>${vehicle.label}</h2><div class="grid"></div>`;
        const grid = section.querySelector('.grid');
        for (const size of sizes) {
          const file = `${vehicle.id}_master_medal_s${size}.webp`;
          const item = manifest.files[file];
          const card = document.createElement('article');
          card.innerHTML = `
            <div class="meta"><strong>${size}×${size}</strong><span>${kb(item.bytes)}</span></div>
            <div class="samples">
              <a class="sample light" href="./${file}" target="_blank"><img src="./${file}" width="${size}" height="${size}" alt="${vehicle.label} ${size}x${size} light background"><small>LIGHT</small></a>
              <a class="sample dark" href="./${file}" target="_blank"><img src="./${file}" width="${size}" height="${size}" alt="${vehicle.label} ${size}x${size} dark background"><small>DARK</small></a>
            </div>`;
          grid.append(card);
        }
        const original = manifest.originals[vehicle.id];
        const card = document.createElement('article');
        card.className = 'original';
        card.innerHTML = `
          <div class="meta"><strong>元PNG 1254×1254</strong><span>${kb(original.bytes)}</span></div>
          <div class="samples">
            <a class="sample light" href="${original.path}" target="_blank"><img src="${original.path}" width="1254" height="1254" alt="${vehicle.label} original PNG light background"><small>LIGHT</small></a>
            <a class="sample dark" href="${original.path}" target="_blank"><img src="${original.path}" width="1254" height="1254" alt="${vehicle.label} original PNG dark background"><small>DARK</small></a>
          </div>`;
        grid.append(card);
        app.append(section);
      }
    });
  </script>
</body>
</html>
