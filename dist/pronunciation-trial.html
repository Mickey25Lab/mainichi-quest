<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07192d">
<title>マイクエ｜発音お試しモード</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Jost:wght@700&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
html,body{margin:0;min-height:100%;background:#07192d;color:#163352;font-family:"Noto Sans JP",sans-serif}
[hidden]{display:none!important}
.trial-stage{width:min(100vw,1000px);min-height:100dvh;margin:auto;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(145deg,#b1def3,#effbff)}
.trial-head{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:21px;font-weight:900}
.trial-head a{color:#28587c;font-size:16px}
.trial-card{background:#fff;border:5px solid #8ac5e5;border-radius:32px;flex:1;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:18px}
.word-pair{display:flex;flex-direction:column;align-items:center}
.word-main{font:700 clamp(72px,15vw,150px)/1.15 "Andika",sans-serif;letter-spacing:3px}
.word-secondary{font:700 clamp(35px,7vw,60px)/1.1 "Andika",sans-serif;color:#8398aa}
.word-pair .jost{font-family:"Jost",sans-serif}
.trial-controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
button{border:3px solid #6aa8d8;border-radius:20px;background:#e0f5ff;color:#1f5483;padding:16px 28px;font:900 clamp(18px,3vw,28px)/1.3 "Noto Sans JP",sans-serif;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#77cbf5;color:#103b67}
.trial-status{margin:0;text-align:center;font-size:20px;min-height:32px}
.trial-response{margin:0;text-align:center;font:700 clamp(26px,5vw,38px)/1.3 "Andika",sans-serif;overflow-wrap:anywhere}
.trial-response small{display:block;font:700 17px "Noto Sans JP",sans-serif}
.trial-judge{background:rgba(255,255,255,.95);border:3px solid #8ac5e5;border-radius:24px;padding:16px}
.trial-judge h2{margin:0 0 10px;font-size:22px}
.trial-judge-buttons{display:flex;flex-wrap:wrap;gap:10px}
.trial-judge-buttons button{flex:1;min-width:160px;padding:14px 8px;font-size:19px}
.trial-result{background:#fff;border-radius:22px;padding:18px;flex:1}
.trial-result h1{font-size:25px;margin:0 0 12px}
.trial-result table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(14px,2.7vw,21px)}
.trial-result th,.trial-result td{padding:8px 4px;border-bottom:1px solid #d8e5ee;text-align:left;overflow-wrap:anywhere}
.trial-result th:nth-child(1){width:22%}.trial-result th:nth-child(2){width:36%}.trial-result th:nth-child(3){width:42%}
.trial-result p{font-size:14px;margin:12px 0}
@media(max-width:600px){.trial-stage{padding:12px;gap:10px}.trial-head{font-size:17px}.trial-card{min-height:160px}.trial-judge-buttons button{min-width:120px;font-size:16px}}
@media print{.trial-stage{background:#fff;padding:0;min-height:auto}.trial-head,.trial-controls,.trial-judge{display:none!important}.trial-result{padding:0}}
</style>
</head>
<body>
<main class="trial-stage">
<div class="trial-head"><span id="progress">お試しモード 1 / 13</span><a href="./index.html">おわる</a></div>
<section id="question" class="trial-card" aria-live="polite">
  <div class="word-pair"><div class="word-main" id="word-lower"></div><div class="word-secondary" id="word-upper"></div></div>
  <p id="status" class="trial-status">ボタンをおして、こえにだしてよもう！</p>
  <p id="response" class="trial-response" hidden><small>iPadがききとった ことば</small><span id="transcript"></span></p>
</section>
<div id="controls" class="trial-controls">
  <button id="start" class="primary" type="button">よんでみる</button>
  <button id="finish" class="primary" type="button" hidden>よみおわったよ</button>
  <button id="retry" type="button" hidden>もういちど</button>
</div>
<section id="judge" class="trial-judge" hidden aria-label="親判定">
  <h2>おうちのひとの はんてい</h2>
  <div class="trial-judge-buttons">
    <button type="button" data-judge="合っている">発音が合っている</button>
    <button type="button" data-judge="間違っている">発音が間違っている</button>
    <button type="button" data-judge="曖昧・ノイズあり">曖昧・ノイズあり</button>
  </div>
</section>
<section id="results" class="trial-result" hidden>
  <h1>おためし けっか（13こ）</h1>
  <table><thead><tr><th>おだい</th><th>iPadの認識結果</th><th>おうちのひとの判定</th></tr></thead><tbody id="result-body"></tbody></table>
  <p>音声認識は発音の正確さを直接採点するものではありません。「認識なし」「エラー」もそのまま記録します。スクリーンショットを撮って共有してください。</p>
</section>
<script>
(() => {
"use strict";
// Current Part 1 vocabulary has 14 entries in main. The 13-word trial uses
// the first 13 (WIND is omitted); no learning state is modified.
const words=["BED","BOX","CAT","DOG","LEG","MAN","MEN","PIG","SUN","TOP","HAND","MILK","NEST"];
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id);
const rows=[];
let index=0,recognition=null,listening=false,phase="ready",best="",pending="",generation=0,settleTimer=0;
function letter(target,word){
  $(target).replaceChildren(...Array.from(word,ch=>{
    const el=document.createElement("span");el.textContent=ch;
    if(ch==="Q"||ch==="t"||ch==="y") el.className="jost";
    return el;
  }));
}
function setStatus(text){$("status").textContent=text;}
function transcript(text){$("transcript").textContent=text||"（認識なし）";$("response").hidden=false;}
function resetRecognition(){
  clearTimeout(settleTimer);
  const old=recognition;recognition=null;listening=false;
  if(old){old.onresult=null;old.onerror=null;old.onend=null;try{old.abort();}catch(_){}}
}
function render(){
  resetRecognition();generation++;best="";pending="";phase="ready";
  $("progress").textContent="お試しモード "+(index+1)+" / "+words.length;
  letter("word-lower",words[index].toLowerCase());letter("word-upper",words[index]);
  $("response").hidden=true;$("judge").hidden=true;$("start").hidden=false;$("finish").hidden=true;$("retry").hidden=true;
  setStatus(Recognition?"ボタンをおして、こえにだしてよもう！":"このiPadでは音声認識が使えません。親判定だけ記録できます。");
  if(!Recognition){$("start").textContent="認識できないので すすむ";}else{$("start").textContent="よんでみる";}
}
function revealJudgement(){
  if(phase==="judge")return;
  phase="judge";listening=false;
  transcript(best||pending||"（認識なし）");
  const normalized=(best||pending).trim().toUpperCase().replace(/[^A-Z]/g,"");
  setStatus("iPadの判定："+(normalized===words[index]?"一致":"不一致 / 認識なし")+"　※発音の正誤とは別");
  $("finish").hidden=true;$("start").hidden=true;$("retry").hidden=false;$("judge").hidden=false;
}
function stop(){
  if(phase!=="listening")return;
  phase="settling";listening=false;$("finish").disabled=true;
  setStatus("ききとった ことばを かくにんちゅう…");
  // stop(), unlike abort(), allows late final results to arrive on iPad.
  try{recognition?.stop();}catch(_){}
  const token=generation;
  settleTimer=setTimeout(()=>{if(generation===token&&phase==="settling")revealJudgement();},1300);
}
function start(){
  if(phase!=="ready")return;
  if(!Recognition){best="（非対応）";revealJudgement();return;}
  resetRecognition();generation++;const token=generation;
  const rec=new Recognition();recognition=rec;
  rec.lang="en-US";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=event=>{
    if(token!==generation||!["listening","settling"].includes(phase))return;
    for(let i=event.resultIndex;i<event.results.length;i++){
      const value=event.results[i][0]?.transcript?.trim()||"";
      if(event.results[i].isFinal)best=value;
      else pending=value;
    }
    transcript(best||pending);
  };
  rec.onerror=event=>{
    if(token!==generation)return;
    if(!best&&!pending)best="（エラー: "+event.error+"）";
    if(phase==="listening")stop();
  };
  rec.onend=()=>{
    if(token!==generation)return;
    if(phase==="listening"){phase="settling";listening=false;}
    if(phase==="settling"){clearTimeout(settleTimer);revealJudgement();}
  };
  try{
    rec.start();phase="listening";listening=true;
    $("start").hidden=true;$("finish").hidden=false;$("finish").disabled=false;$("retry").hidden=true;$("judge").hidden=true;$("response").hidden=true;
    setStatus("きいているよ！ よみおわったら ボタンをおしてね");
  }catch(error){
    best="（開始エラー）";revealJudgement();
  }
}
function complete(){
  resetRecognition();$("question").hidden=true;$("controls").hidden=true;$("judge").hidden=true;$("results").hidden=false;
  $("progress").textContent="お試しモード　けっか";
  const body=$("result-body");body.replaceChildren();
  for(const row of rows){
    const tr=document.createElement("tr");
    for(const value of [row.word,row.recognized,row.judgement]){
      const cell=document.createElement("td");cell.textContent=value;tr.append(cell);
    }
    body.append(tr);
  }
}
$("start").addEventListener("click",start);
$("finish").addEventListener("click",stop);
$("retry").addEventListener("click",render);
$("judge").addEventListener("click",event=>{
  const target=event.target.closest("button[data-judge]");
  if(!target||phase!=="judge")return;
  rows.push({word:words[index],recognized:best||pending||"（認識なし）",judgement:target.dataset.judge});
  index++;
  if(index===words.length)complete();else render();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&phase==="listening")stop();});
window.addEventListener("pagehide",resetRecognition);
render();
})();
</script>
</main>
</body></html>
