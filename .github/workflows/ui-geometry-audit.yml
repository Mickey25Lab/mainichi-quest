name: UI geometry audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-geometry-audit:
    name: Multi-viewport UI geometry
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect documentation-only PR
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(docs/.*|.*\.md)$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip browser tests (documentation only)
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; browser checks not required."
      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright package
        if: steps.changes.outputs.docs_only != 'true'
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Measure UI at four viewport sizes
        if: steps.changes.outputs.docs_only != 'true'
        run: node tests/ui-scale-audit.cjs
      - name: Check active UI geometry via navigation
        if: steps.changes.outputs.docs_only != 'true'
        run: node tests/ui-interaction-geometry.test.cjs
      - name: Upload geometry report
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-scale-audit
          path: audit-results/ui-scale/
          if-no-files-found: warn
