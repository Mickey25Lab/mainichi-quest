name: UI geometry audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-geometry-audit:
    name: Multi-viewport UI geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Measure UI at four viewport sizes
        run: node tests/ui-scale-audit.cjs
      - name: Upload geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-scale-audit
          path: audit-results/ui-scale/
          if-no-files-found: error
