name: UI geometry audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-geometry-audit:
    name: Multi-viewport UI geometry
    # Playwright 1.58.2 cannot install Chromium on Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        timeout-minutes: 10
        run: |
          echo "Browser installation started: $(date -u +%FT%TZ)"
          node --version
          npm --version
          npm install --no-save --no-package-lock --loglevel=info playwright@1.58.2
          echo "Playwright package installed: $(date -u +%FT%TZ)"
          npx playwright install --with-deps chromium
          echo "Chromium installed: $(date -u +%FT%TZ)"
      - name: Measure UI at four viewport sizes
        run: node tests/ui-scale-audit.cjs
      - name: Check active UI geometry via navigation
        run: node tests/ui-interaction-geometry.test.cjs
      - name: Upload geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-scale-audit
          path: audit-results/ui-scale/
          if-no-files-found: error
