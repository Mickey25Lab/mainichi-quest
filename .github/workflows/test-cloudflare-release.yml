name: Cloudflare release metadata test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloudflare-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Cloudflare release metadata generation
        run: node --test .github/scripts/prepare-cloudflare-release.test.mjs
      - name: Check app.js syntax
        run: node --check dist/app.js
