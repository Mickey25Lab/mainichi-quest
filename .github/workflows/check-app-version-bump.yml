name: Check unchanged PR version

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-app-version-bump:
    name: Check unchanged PR version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test version checker
        run: node --test .github/scripts/check-app-version-bump.test.mjs

      - name: Ensure PR does not manually bump appVersion
        run: node .github/scripts/check-app-version-bump.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
