name: Post Cloudflare preview QR to PR

# Cloudflare Pages updates its deployment comment after the build finishes.
# The workflow runs from the default branch, not untrusted PR code.
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to refresh from Cloudflare comments"
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: cloudflare-preview-qr-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  post-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'cloudflare-workers-and-pages[bot]' &&
       contains(github.event.comment.body, 'Deploy successful!'))
    runs-on: ubuntu-latest
    steps:
      - name: Post or update PR preview QR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs?.pr_number)
              : context.issue.number;
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('Invalid pull request number');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({owner, repo, pull_number: prNumber});
            const commitSha = pull.head.sha;
            // Always read the latest Cloudflare comment: created events can
            // arrive before Cloudflare edits the deployment result in place.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const deploymentComments = comments.filter(c =>
              c.user?.login === 'cloudflare-workers-and-pages[bot]' &&
              c.body?.includes('Deploy successful!')
            );
            const latest = deploymentComments.at(-1);
            if (!latest) {
              core.info('No successful Cloudflare deployment comment yet');
              return;
            }
            const found = latest.body.match(
              /Branch Preview URL:[\s\S]*?https:\/\/([a-z0-9-]+\.mainichi-quest-63c\.pages\.dev)\b/i
            );
            if (!found) {
              core.info('Cloudflare branch preview URL is not present');
              return;
            }
            const url = 'https://' + found[1].toLowerCase();
            const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=16&data=' +
              encodeURIComponent(url);
            const marker = '<!-- mainichi-quest-cloudflare-preview-qr -->';
            const body = [
              marker,
              '## 📱 iPad用 Cloudflare Preview',
              '**✅ デプロイ成功**',
              '',
              '**PR:** #' + prNumber,
              '**最新コミットID (SHA):** [`' + commitSha + '`](https://github.com/' + owner + '/' + repo + '/commit/' + commitSha + ')',
              '',
              '**[Previewを開く](' + url + ')**',
              '',
              '![Preview URL QRコード](' + qrUrl + ')',
              '',
              'このQRコードは上記のブランチPreview URLを開きます。',
            ].join('\n');
            // Existing PR updates get an updated SHA when the next successful preview arrives.
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' &&
              c.body?.includes(marker));
            if (previous) {
              if (previous.body === body) {
                core.info('Preview QR comment is already current');
                return;
              }
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
              core.info('Updated preview QR comment: ' + url);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
              core.info('Posted preview QR comment: ' + url);
            }
