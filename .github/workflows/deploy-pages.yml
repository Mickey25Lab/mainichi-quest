name: Deploy GitHub Pages and propose patch version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: bump production app version')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Generate patch version proposal
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          node .github/scripts/bump-main-version.mjs "$BEFORE_SHA" "$AFTER_SHA"
      - name: Open patch version PR (never push to protected main)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump production app version"
          branch: automation/production-app-version
          delete-branch: true
          title: "chore: bump production app version"
          body: |
            Automatic patch version proposal generated from a main merge.
            This PR changes only the appVersion declaration in dist/app.js.
            It must pass the normal required checks and receive explicit approval before merge.
          add-paths: dist/app.js
  deploy:
    # Publishing must not be blocked by an auto-version PR needing approval
    # or by GitHub repository settings that prevent Actions from opening PRs.
    if: always()
    needs: [version]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
